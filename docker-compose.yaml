# ---------------------------------------------------------------------------
# EduCoach (ProKoc) frontend — docker compose
#
# Kullanim:
#   docker compose build
#   docker compose up -d
#   # tarayici: http://localhost:3000
#
# ONEMLI: NEXT_PUBLIC_API_BASE_URL *build zamaninda* bundle'a gomulur. Backend
# adresini degistirirseniz imaji yeniden build etmeniz gerekir:
#   NEXT_PUBLIC_API_BASE_URL=http://192.168.1.20:5295/api/v1.0 docker compose build
#
# Adres tarayicidan erisilebilir olmalidir (axios istekleri istemcide atilir).
# Ayni makinede .NET backend 5295 portunda calisiyorsa varsayilan dogru calisir.
# ---------------------------------------------------------------------------

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time: istemci tarafi API adresi (bundle'a gomulur).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5295/api/v1.0}
    image: coaching_frontend:latest
    container_name: coaching_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # -------------------------------------------------------------------------
  # Backend (.NET) bu depoda container'a alinmamis. Backend kaynak deposunda
  # bir Dockerfile varsa, asagidaki ornek servisi acip ayni aga baglayabilirsiniz.
  # Boylece NEXT_PUBLIC_API_BASE_URL yerine ayni-origin icin bir reverse proxy
  # (nginx) kullanmak da mumkundur.
